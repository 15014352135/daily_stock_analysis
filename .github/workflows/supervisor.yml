name: 监督员
# 由外部 cron-job.org 每天定点通过 workflow_dispatch 唤醒：
#   - 每天 16:15 北京时间 → 检查当天 15:45 的「每日股票分析」是否跑过，没跑就补跑
# 查岗/补跑使用 GitHub 自带 GITHUB_TOKEN，不依赖个人 PAT。
on:
  workflow_dispatch:
    inputs:
      slot:
        description: '检查时段（daily 固定为 main）'
        required: false
        type: choice
        default: main
        options:
          - main

permissions:
  actions: write      # 需要触发补跑（dispatch 另一个 workflow）
  contents: write     # 需要提交状态表

concurrency:
  group: supervision-main
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查当天运行并按需补跑
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLOT: ${{ github.event.inputs.slot || 'main' }}
        run: python3 scripts/supervisor.py

      - name: 提交监督状态表
        run: |
          git config user.name "supervisor-bot"
          git config user.email "supervisor-bot@users.noreply.github.com"
          git add SUPERVISION.md data/supervision 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git pull --rebase origin "${{ github.ref_name }}" || true
            git commit -m "supervision $(date -u +%F-%H%M) [skip ci]"
            git push
          fi
